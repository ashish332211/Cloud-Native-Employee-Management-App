kind: Deployment
apiVersion: apps/v1

metadata:
  name: employee-app 

spec:
  replicas: 1

  selector:
    matchLabels: 
      app: emp-app 

  template:
    metadata:
      labels:
        app: emp-app

    spec:
      containers:
      - name: employee-app
        image: 359554405506.dkr.ecr.us-east-1.amazonaws.com/employee-app:latest
        ports:
        - containerPort: 5000 
        envFrom:
        - secretRef:
            name: employee-app-secret
     
