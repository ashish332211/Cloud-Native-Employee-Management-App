kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: employee-app-hpa
  
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employee-app

  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50